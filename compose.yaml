name: jnc-bookshelf

services:
  app:
    build: .
    image: jnc-bookshelf:latest
    container_name: jnc-bookshelf
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-bookshelf}"
      DB_USER: "${DB_USER:-bookshelf}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jnc-bookshelf

  db:
    image: mariadb:11.4
    container_name: jnc-bookshelf-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-bookshelf}"
      MARIADB_USER: "${DB_USER:-bookshelf}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - "${DB_DATA_PATH:-./data/mariadb}:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jnc-bookshelf

networks:
  jnc-bookshelf:
    name: jnc-bookshelf
