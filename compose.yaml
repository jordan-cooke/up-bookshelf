name: jnc-bookshelf

services:
  app:
    build: .
    image: jnc-bookshelf:latest
    container_name: jnc-bookshelf
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      DB_PATH: /data/bookshelf.sqlite
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - "${APP_DATA_PATH:-./data}:/data"
